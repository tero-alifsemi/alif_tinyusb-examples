# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.12.0/tools/projmgr/schemas/csolution.schema.json
solution:
  created-for: cmsis-toolbox@2.12.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: GCC

  # Select used compiler
  compiler: GCC

  packs:
    - pack: AlifSemiconductor::Ensemble@2.1.0
    - pack: ARM::CMSIS@6.2.0
    - pack: ARM::CMSIS-FreeRTOS@11.2.0

  target-types:
    - type: DevKit-E7-HE
      device: Alif Semiconductor::AE722F80F55D5LS:M55_HE
      board: Alif Semiconductor::DevKit-E7
      define:
        - "CORE_M55_HE"
      target-set:
        - set:
          images:
            - project-context: device_net_lwip_webserver_freertos.debug
            - project-context: device_net_lwip_webserver.debug
            - project-context: device_hid_multiple_interface.debug
            - project-context: device_hid_composite_freertos.debug
            - project-context: device_hid_composite.debug
            - project-context: device_hid_boot_interface.debug
            - project-context: device_msc_dual_lun.debug
            - project-context: device_cdc_msc_freertos.debug
            - project-context: device_cdc_msc.debug
            - project-context: device_cdc_dual_ports.debug

    - type: DevKit-E7-HP
      device: Alif Semiconductor::AE722F80F55D5LS:M55_HP
      board: Alif Semiconductor::DevKit-E7
      define:
        - "CORE_M55_HP"
      target-set:
        - set:
          images:
            - project-context: device_net_lwip_webserver_freertos.debug
            - project-context: device_net_lwip_webserver.debug
            - project-context: device_hid_multiple_interface.debug
            - project-context: device_hid_composite_freertos.debug
            - project-context: device_hid_composite.debug
            - project-context: device_hid_boot_interface.debug
            - project-context: device_msc_dual_lun.debug
            - project-context: device_cdc_msc_freertos.debug
            - project-context: device_cdc_msc.debug
            - project-context: device_cdc_dual_ports.debug

    - type: DevKit-E7-E3-HE
      device: Alif Semiconductor::AE302F80F55D5LE:M55_HE
      board: Alif Semiconductor::DevKit-E7
      define:
        - "CORE_M55_HE"
      # Workaround: E3 has no SoC condition in the DFP, so board and SOC headers
      # are not resolved automatically. Manually add E7 equivalents.
      add-path:
        - $Pack(AlifSemiconductor::Ensemble)$/Boards/DevKit-e7
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/include
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/include/rtss_he
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/rte
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/config
      target-set:
        - set:
          images:
            - project-context: device_net_lwip_webserver_freertos.debug
            - project-context: device_net_lwip_webserver.debug
            - project-context: device_hid_multiple_interface.debug
            - project-context: device_hid_composite_freertos.debug
            - project-context: device_hid_composite.debug
            - project-context: device_hid_boot_interface.debug
            - project-context: device_msc_dual_lun.debug
            - project-context: device_cdc_msc_freertos.debug
            - project-context: device_cdc_msc.debug
            - project-context: device_cdc_dual_ports.debug
    - type: DevKit-E7-E3-HP
      device: Alif Semiconductor::AE302F80F55D5LE:M55_HP
      board: Alif Semiconductor::DevKit-E7
      define:
        - "CORE_M55_HP"
      # Workaround: E3 has no SoC condition in the DFP, so board and SOC headers
      # are not resolved automatically. Manually add E7 equivalents.
      add-path:
        - $Pack(AlifSemiconductor::Ensemble)$/Boards/DevKit-e7
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/include
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/include/rtss_hp
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/rte
        - $Pack(AlifSemiconductor::Ensemble)$/Device/soc/AE722F80F55D5/config
      target-set:
        - set:
          images:
            - project-context: device_net_lwip_webserver_freertos.debug
            - project-context: device_net_lwip_webserver.debug
            - project-context: device_hid_multiple_interface.debug
            - project-context: device_hid_composite_freertos.debug
            - project-context: device_hid_composite.debug
            - project-context: device_hid_boot_interface.debug
            - project-context: device_msc_dual_lun.debug
            - project-context: device_cdc_msc_freertos.debug
            - project-context: device_cdc_msc.debug
            - project-context: device_cdc_dual_ports.debug
    - type: DevKit-E8-HE
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HE
      board: Alif Semiconductor::DevKit-E8
      define:
        - "CORE_M55_HE"
      target-set:
        - set:
          images:
            - project-context: device_cdc_msc.debug
            - project-context: device_net_lwip_webserver_freertos.debug
            - project-context: device_net_lwip_webserver.debug
            - project-context: device_hid_multiple_interface.debug
            - project-context: device_hid_composite_freertos.debug
            - project-context: device_hid_composite.debug
            - project-context: device_hid_boot_interface.debug
            - project-context: device_msc_dual_lun.debug
            - project-context: device_cdc_msc_freertos.debug
            - project-context: device_cdc_dual_ports.debug

    - type: DevKit-E8-HP
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HP
      board: Alif Semiconductor::DevKit-E8
      define:
        - "CORE_M55_HP"
      target-set:
        - set:
          images:
            - project-context: device_cdc_dual_ports.debug

    - type: DevKit-E1C-HE
      device: Alif Semiconductor::AE1C1F4051920PH0:M55_HE
      board: Alif Semiconductor::DevKit-E1C
      define:
        - "CORE_M55_HE"
      target-set:
        - set:
          images:
            - project-context: device_net_lwip_webserver_freertos.debug
            - project-context: device_net_lwip_webserver.debug
            - project-context: device_hid_multiple_interface.debug
            - project-context: device_hid_composite_freertos.debug
            - project-context: device_hid_composite.debug
            - project-context: device_hid_boot_interface.debug
            - project-context: device_msc_dual_lun.debug
            - project-context: device_cdc_msc_freertos.debug
            - project-context: device_cdc_msc.debug
            - project-context: device_cdc_dual_ports.debug
    - type: AppKit-E8-HE
      device: Alif Semiconductor::AE822FA0E5597BS0:M55_HE
      board: Alif Semiconductor::AppKit-E8-AIML
      define:
        - "CORE_M55_HE"
      target-set:
        - set:
          images:
            - project-context: device_cdc_msc.debug

    - type: AppKit-E8-HP
      device: Alif Semiconductor::AE822FA0E5597BS0:M55_HP
      board: Alif Semiconductor::AppKit-E8-AIML
      define:
        - "CORE_M55_HP"
      target-set:
        - set:
          images:
            - project-context: device_cdc_msc.debug

  build-types:
    - type: debug
      optimize: none
      debug: on
      define:
        - _DEBUG
    - type: release
      optimize: speed
      debug: on
      define:
        - _RELEASE

  define:
    - UNICODE
    - _UNICODE

  projects:
    - project: examples/device/cdc_msc/device_cdc_msc.cproject.yml
    - project: examples/device/cdc_dual_ports/device_cdc_dual_ports.cproject.yml
    - project: examples/device/cdc_msc_freertos/device_cdc_msc_freertos.cproject.yml
    - project: examples/device/msc_dual_lun/device_msc_dual_lun.cproject.yml
    - project: examples/device/hid_boot_interface/device_hid_boot_interface.cproject.yml
    - project: examples/device/hid_composite/device_hid_composite.cproject.yml
    - project: examples/device/hid_composite_freertos/device_hid_composite_freertos.cproject.yml
    - project: examples/device/hid_multiple_interface/device_hid_multiple_interface.cproject.yml
    - project: examples/device/net_lwip_webserver/device_net_lwip_webserver.cproject.yml
    - project: examples/device/net_lwip_webserver_freertos/device_net_lwip_webserver_freertos.cproject.yml
